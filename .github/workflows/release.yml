name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the version matches the source
        run: |
          declared=$(grep -o 'DAYBREAK_VERSION <- "[^"]*"' R/version.R | cut -d'"' -f2)
          if [ "$declared" != "${{ steps.version.outputs.number }}" ]; then
            echo "Tag ${{ steps.version.outputs.number }} does not match R/version.R ($declared)."
            exit 1
          fi

      - name: Extract the changelog section for this version
        run: |
          awk -v want="## ${{ steps.version.outputs.number }}" '
            index($0, want) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for ${{ steps.version.outputs.number }}."
            exit 1
          fi

      - name: Build the downloadable copy
        run: |
          mkdir -p build/daybreak
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' ./ build/daybreak/
          cd build && zip -qr ../daybreak.zip daybreak

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Daybreak ${{ steps.version.outputs.number }}
          body_path: release-notes.md
          files: daybreak.zip
